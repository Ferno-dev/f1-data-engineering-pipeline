name: F1 Pipeline CI

# Trigger on pull requests targeting main.
# Each job is a separate check so GitHub can enforce them independently
# via branch protection rules.
on:
  pull_request:
    branches: [main]

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────
  # Run ruff first — it's the fastest feedback loop.
  # If style is broken there is no point running slower test jobs.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # astral-sh/setup-uv installs uv and caches the virtual environment,
      # keeping subsequent runs fast without a manual cache step.
      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff linter
        run: uv run ruff check src tests

  # ── 2. Unit tests ──────────────────────────────────────────────────────
  # Runs only after lint passes (needs: lint).
  # Tests ingestion Python scripts as required.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest tests/unit -v

  # ── 3. SQL data-validation tests ───────────────────────────────────────
  # Runs only after lint passes (needs: lint).
  # Requires data/raw/*.parquet to exist; we generate them with a quick
  # smoke ingestion before running DuckDB assertions.
  sql-tests:
    name: SQL Validation Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      # Ingest sample data so Parquet files exist for DuckDB to query.
      - name: Generate sample Parquet data
        run: |
          uv run python -m src.ingestion.drivers
          uv run python -m src.ingestion.laps

      - name: Run SQL validation tests
        run: uv run pytest tests/sql/test_sql_validation.py -v
