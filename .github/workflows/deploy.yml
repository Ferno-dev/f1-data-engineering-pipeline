name: F1 Pipeline Deploy

# Trigger on every push to main (i.e. after a PR is merged).
# Mirrors the CI checks so a direct push cannot bypass quality gates.
on:
  push:
    branches: [main]

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff linter
        run: uv run ruff check src tests

  # ── 2. Unit tests ──────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest tests/unit -v

  # ── 3. SQL data-validation tests ───────────────────────────────────────
  sql-tests:
    name: SQL Validation Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate sample Parquet data
        run: |
          uv run python -m src.ingestion.drivers
          uv run python -m src.ingestion.laps

      - name: Run SQL validation tests
        run: uv run pytest tests/sql/test_sql_validation.py -v

  # ── 4. Pipeline smoke test (optional) ─────────────────────────────────
  # Runs only after all quality gates pass (needs both test jobs).
  # Executes a real incremental ingestion run to confirm the pipeline
  # is end-to-end healthy on every merge to main.
  # Mark continue-on-error: true so a transient API failure does not
  # block the artifact upload below.
  pipeline-smoke-test:
    name: Pipeline Smoke Test (optional)
    runs-on: ubuntu-latest
    needs: [unit-tests, sql-tests]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ingestion job (drivers + laps)
        run: |
          uv run python -m src.ingestion.drivers
          uv run python -m src.ingestion.laps

      - name: Verify Parquet output exists
        run: |
          test -f data/raw/drivers.parquet && echo "drivers.parquet OK"
          test -f data/raw/laps.parquet    && echo "laps.parquet OK"

  # ── 5. Archive and upload artifact ────────────────────────────────────
  # Runs after all quality gates pass.
  # Packages only source code (no venv / data files).
  archive:
    name: Archive Artifact
    runs-on: ubuntu-latest
    needs: [unit-tests, sql-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build archive
        run: |
          mkdir -p dist
          tar -czf dist/f1-data-pipeline-${{ github.sha }}.tar.gz \
            src orchestration config pyproject.toml README.md

      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifact-${{ github.sha }}
          path: dist/
          retention-days: 30
